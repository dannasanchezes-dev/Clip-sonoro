<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clip Sonoro - Edwar Ávila</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(2, 10, 18, 0.75), rgba(1, 8, 14, 0.95)),
                url("BLOQUE.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;

            color: white;
        }

        .contenedor {
            width: 100%;
            max-width: 700px;

            background: rgba(3, 18, 29, 0.92);

            border: 2px solid #35e6f5;

            border-radius: 25px;

            padding: 35px;

            text-align: center;

            box-shadow:
                0 0 15px #1bd9eb,
                0 0 40px rgba(27, 217, 235, 0.35);

            backdrop-filter: blur(5px);
        }

        .etiqueta {
            color: #45e8f5;

            font-size: 14px;

            letter-spacing: 4px;

            margin-bottom: 15px;
        }

        h1 {
            font-size: 52px;

            color: white;

            letter-spacing: 3px;

            text-shadow:
                3px 3px 0 #087b91,
                0 0 15px #22dbea;

            margin-bottom: 8px;
        }

        .nombre {
            font-size: 20px;

            color: #6debf5;

            letter-spacing: 3px;

            margin-bottom: 30px;
        }

        .imagen {
            width: 280px;
            height: 280px;

            object-fit: cover;

            border-radius: 20px;

            border: 3px solid #45e8f5;

            box-shadow:
                0 0 15px #23dcea,
                0 0 35px rgba(35, 220, 234, 0.5);

            margin-bottom: 30px;

            transition: 0.3s;
        }

        .imagen:hover {
            transform: scale(1.04);

            box-shadow:
                0 0 25px #23dcea,
                0 0 50px rgba(35, 220, 234, 0.7);
        }

        .audio {
            background: rgba(1, 10, 17, 0.9);

            border-radius: 18px;

            padding: 25px;

            border: 1px solid #1dcfe1;
        }

        .audio h2 {
            font-size: 22px;

            margin-bottom: 20px;

            color: #ffffff;
        }

        audio {
            width: 100%;

            height: 50px;
        }

        .texto {
            margin-top: 20px;

            color: #b9d3d8;

            font-size: 15px;

            line-height: 1.6;
        }

        @media (max-width: 600px) {

            .contenedor {
                padding: 25px 18px;
            }

            h1 {
                font-size: 38px;
            }

            .nombre {
                font-size: 16px;
            }

            .imagen {
                width: 230px;
                height: 230px;
            }

        }

    </style>
</head>

<body>

    <div class="contenedor">

        <div class="etiqueta">
            CLIP SONORO
        </div>

        <h1>
            EDWAR ÁVILA
        </h1>

        <div class="nombre">
            ESCUCHA EL AUDIO
        </div>


        <!-- IMAGEN DEL BLOQUE -->

        <img
            src="BLOQUE.jpg"
            alt="Bloque de diamante"
            class="imagen"
        >


        <!-- AUDIO -->

        <div class="audio">

            <h2>
                Reproducir clip sonoro
            </h2>

            <audio controls>

                <source
                    src="EDWAR AVILA.mp3"
                    type="audio/mpeg"
                >

                Tu navegador no puede reproducir este audio.

            </audio>

            <p class="texto">
                Presiona ▶ para escuchar el clip sonoro.
            </p>

        </div>

    </div>

</body>
</html>
