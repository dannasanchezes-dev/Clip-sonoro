<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clip Sonoro - Edwar Ávila</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;

            background:
                radial-gradient(circle at top, #123c52, #06141f 45%, #02070c);

            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .pagina {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .titulo-pequeno {
            display: inline-block;
            padding: 9px 20px;
            border: 1px solid #20dff2;
            border-radius: 30px;

            color: #20dff2;
            font-size: 14px;
            letter-spacing: 3px;

            margin-bottom: 20px;
        }

        h1 {
            font-size: 65px;
            letter-spacing: 4px;

            text-shadow:
                0 0 10px #20dff2,
                0 0 25px #20dff2;

            margin-bottom: 8px;
        }

        .subtitulo {
            font-size: 23px;
            color: #28e5f5;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        /* BLOQUE DE DIAMANTE */

        .diamante {
            width: 390px;
            max-width: 90%;

            border-radius: 20px;

            display: block;
            margin: 0 auto 25px;

            filter:
                drop-shadow(0 0 12px #16ddeb)
                drop-shadow(0 0 30px #0b7e91);
        }

        /* TARJETA DEL AUDIO */

        .audio-contenedor {
            background: rgba(3, 24, 36, 0.92);

            border: 1px solid #18d9ec;

            border-radius: 25px;

            padding: 30px;

            box-shadow:
                0 0 25px rgba(0, 217, 238, 0.15),
                0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .audio-titulo {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .audio-titulo span {
            color: #20e4f5;
        }

        audio {
            width: 100%;
            height: 55px;
        }

        .texto {
            margin-top: 20px;

            color: #c7d9df;

            font-size: 16px;
            line-height: 1.5;
        }

        .final {
            margin-top: 28px;

            color: #25dceb;

            font-size: 18px;
            letter-spacing: 1px;
        }

        .pie {
            margin-top: 18px;

            color: #6e8994;

            font-size: 13px;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            h1 {
                font-size: 42px;
                letter-spacing: 2px;
            }

            .subtitulo {
                font-size: 17px;
                letter-spacing: 2px;
            }

            .diamante {
                width: 300px;
            }

            .audio-contenedor {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <div class="pagina">

        <div class="titulo-pequeno">
            🎧 CLIP SONORO
        </div>

        <h1>
            EDWAR ÁVILA
        </h1>

        <div class="subtitulo">
            ESCÚCHALO AQUÍ
        </div>


        <!-- IMAGEN DEL BLOQUE DE DIAMANTE -->

        <img
            src="bloque-diamante.png"
            alt="Bloque de diamante"
            class="diamante"
        >


        <!-- REPRODUCTOR -->

        <div class="audio-contenedor">

            <div class="audio-titulo">
                🎵 <span>Reproduce el clip sonoro</span>
            </div>

            <audio controls>

                <source
                    src="EDWAR AVILA.mp3"
                    type="audio/mpeg"
                >

                Tu navegador no puede reproducir este audio.

            </audio>

            <p class="texto">
                Presiona el botón de reproducción para escuchar
                el clip sonoro.
            </p>

        </div>


        <div class="final">
            💎 Gracias por escuchar
        </div>

        <div class="pie">
            Clip sonoro
        </div>

    </div>

</body>
</html>
