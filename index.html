<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip sonoro - Edwar Ávila</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#111827,#374151,#111827);
    padding:25px;
}
.contenedor{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,.96);
    border-radius:25px;
    padding:32px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}
.icono{
    width:95px;height:95px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:#111827;
    color:white;
}
h1{font-size:27px;color:#111827;margin-bottom:8px}
.subtitulo{color:#6b7280;font-size:16px;margin-bottom:25px}
.audio-box{
    background:#f3f4f6;
    padding:18px;
    border-radius:18px;
    margin-bottom:22px;
}
audio{width:100%}
.mensaje{
    color:#374151;
    line-height:1.5;
    font-size:15px;
}
.footer{
    margin-top:24px;
    font-size:12px;
    color:#9ca3af;
}
</style>
</head>
<body>
<div class="contenedor">
    <div class="icono">🎧</div>
    <h1>Clip sonoro</h1>
    <p class="subtitulo">Edwar Ávila</p>

    <div class="audio-box">
        <audio controls>
            <source src="EDWAR%20AVILA.mp3" type="audio/mpeg">
            Tu navegador no puede reproducir este audio.
        </audio>
    </div>

    <p class="mensaje">
        Presiona el botón de reproducción para escuchar el clip sonoro.
    </p>

    <p class="footer">Contenido académico</p>
</div>
</body>
</html>
